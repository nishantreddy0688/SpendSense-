services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendsense
      POSTGRES_PASSWORD: spendsense
      POSTGRES_DB: spendsense
    volumes:
      - spendsense-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendsense -d spendsense"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://spendsense:spendsense@db:5432/spendsense
      SECRET_KEY: ${SECRET_KEY:-replace-this-before-deployment}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  spendsense-data:
